<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Mobiles-Plus Quincaillerie</title>
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f2f4f8;--card:#fff;--fg:#14233a;--mut:#5d6b80;--line:#dbe2ec;--navy:#123B6D;--nb:#123B6D;--red:#c62525;--ph:#f2f4f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{height:auto}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Open Sans","Segoe UI",Arial,sans-serif}
button,.send{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff;text-decoration:none;display:inline-block;text-align:center}
input,textarea,select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy);font-weight:600}
.send{background:var(--red);font-weight:700;margin:8px 8px 0 0}.send.dis{opacity:.5;pointer-events:none}
header{background:var(--card);border-bottom:4px solid var(--red)}
.top{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font:700 26px Oswald,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.5px}.n1{color:var(--nb)}.n2{color:var(--red)}
.sb{flex:1;min-width:240px;display:flex;border:2px solid var(--red);border-radius:999px;overflow:hidden;background:var(--card)}
.sb input{border:0;border-radius:0;flex:1;width:auto}.sb button{border-radius:0;background:var(--red);font-weight:700;padding:9px 20px}
.hb{display:flex;gap:8px}
.tabs{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tabs button{background:transparent;color:var(--fg);border-radius:0;border-bottom:3px solid transparent;white-space:nowrap}.tabs .on{border-color:var(--red);font-weight:700}
main{max-width:1200px;margin:0 auto;padding:16px}
.lay{display:grid;gap:16px;grid-template-columns:1fr}@media(min-width:800px){.lay{grid-template-columns:210px 1fr}}
aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;align-self:start}
aside summary{font-weight:700;cursor:pointer}aside h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;color:var(--mut)}
.lk{display:block;background:none;color:var(--fg);padding:5px 0;text-align:left;width:100%;border-radius:0}.lk.on{color:var(--red);font-weight:700}
.pr2{display:flex;gap:6px;align-items:center}.pr2 input{padding:6px}
.cs{display:flex;gap:10px;overflow-x:auto;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.cc{background:transparent;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:6px;min-width:78px;padding:2px;font-size:13px}
.cc span{width:62px;height:62px;border-radius:50%;background:var(--ph);display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid transparent}.cc.on span{border-color:var(--red)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 10px;color:var(--mut)}.meta label{display:flex;gap:6px;align-items:center;white-space:nowrap;margin:0}.meta select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1;background:var(--ph);display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.hrt{position:absolute;top:8px;right:8px;width:32px;height:32px;padding:0;border-radius:50%;background:rgba(255,255,255,.92);color:var(--red);font-size:18px}
.bd{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}.bd h3{margin:0;font-size:15px}.pr{margin:0;font-weight:700;font-size:18px}.bd .add{margin-top:auto}
.pe{display:flex;gap:6px;align-items:center;font-weight:700}.pe input{padding:6px}
.tag{border:1px solid var(--red);color:var(--red);border-radius:4px;padding:0 6px;font-size:12px;width:fit-content}.out{color:var(--mut);font-weight:600;font-size:13px}.mut{color:var(--mut)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:20px}
section h2{margin:0 0 10px;font:700 22px Oswald,Impact,"Arial Narrow",sans-serif}section a{color:var(--nb);font-weight:600}section p{margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.row>span:first-child{flex:1}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 10px}.tot{font-weight:700;font-size:18px}
label{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
.prow{display:grid;grid-template-columns:56px 56px 1.5fr 1fr 100px auto auto;gap:6px;align-items:center;margin-top:8px}
.prow .chk{display:flex;gap:4px;align-items:center;margin:0}.prow .chk input{width:auto}
.pic{width:56px;height:56px;margin:0;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;font-size:22px}.pic img{width:100%;height:100%;object-fit:cover}
@media(max-width:640px){.prow{grid-template-columns:56px 56px 1fr}}
.rd{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--fg)}.rd input{width:auto}.pay{background:var(--ph);border-radius:8px;padding:10px;margin-top:8px}#shp{max-width:1200px;margin:0 auto;padding:4px 16px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}#shp .send{margin:0}html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}img{max-width:100%}button{min-height:40px}
@media(max-width:640px){
 input,textarea,select{font-size:16px}
 .top{padding:10px 12px;gap:8px}
 .logo{order:1;flex:1 1 100%;font-size:21px;line-height:1.15}
 .hb{order:2;width:100%}.hb button{flex:1;padding:8px 6px;font-size:14px}
 .sb{order:3;flex:1 1 100%;min-width:0}.sb button{padding:9px 14px}
 .tabs{padding:0 8px}.tabs button{padding:8px 10px}
 main{padding:10px}
 .cs{padding:8px;gap:6px}.cc{min-width:68px;font-size:12px}.cc span{width:54px;height:54px;font-size:26px}
 .meta{flex-wrap:wrap;margin:10px 0 8px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
 .ph{font-size:48px}.hrt{width:36px;height:36px}
 .bd{padding:8px}.bd h3{font-size:14px}.pr{font-size:16px}.pe input{min-width:0}
 section{padding:12px}
 .row{flex-wrap:wrap}.row>span:first-child{flex:1 1 100%}
 .send,.ghost{width:100%;margin:8px 0 0}#shp{padding:4px 12px 10px}#shp .send,#shp .ghost{width:auto;flex:1 1 40%}.hb .ghost,.hb button{margin:0;width:auto}
}
.cc span{overflow:hidden}.cc span img{width:100%;height:100%;object-fit:cover}/* Fonds allégés : page unie, cartes et cadres sans fond */
body{background:var(--card)}
.card,aside,.cs,.pay,section{background:transparent;border:0;border-radius:0}
.cs{padding:8px 0}aside{padding:0 0 8px}
.ph{background:transparent;border-radius:12px}
.cc span{background:transparent;border:1px solid var(--line)}.cc.on span{border-color:var(--red)}
.pay{border:1px dashed var(--line);border-radius:8px}
section{border-top:1px solid var(--line);padding-left:0;padding-right:0}
:root{color-scheme:light!important}html,body{background:#fff!important}/* Produits plus petits */
.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bd{padding:6px 2px;gap:3px}.bd h3{font-size:13px;line-height:1.25}.pr{font-size:14px}
.bd .add{padding:6px 4px;font-size:12px;min-height:32px}.tag,.out{font-size:11px}
.ph{font-size:36px}.hrt{width:26px;height:26px;font-size:14px;top:6px;right:6px}
@media(max-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}.bd{padding:5px 1px}.bd h3{font-size:12px}.pr{font-size:13px}.ph{font-size:32px}}
/* Défilement des catégories */
.lay{grid-template-columns:minmax(0,1fr)}
@media(min-width:800px){.lay{grid-template-columns:210px minmax(0,1fr)}}
.lay>*{min-width:0}
.cs{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;scrollbar-width:none;max-width:100%}
.cs::-webkit-scrollbar{display:none}
.cc{flex:0 0 auto}
.qr{width:min(260px,100%);height:auto;display:block;margin:6px 0;background:#fff;padding:6px;border-radius:8px;image-rendering:pixelated}
/* Retour visuel au toucher */
*{-webkit-tap-highlight-color:rgba(198,37,37,.25)}
button,.send,.card,.cc,.lk{transition:transform .12s,opacity .12s}
button:active,.send:active,.card:active,.cc:active,.lk:active{transform:scale(.96);opacity:.85}
.tap{outline:2px solid var(--red);outline-offset:2px}
.card.sel .ph{outline:3px solid var(--red);outline-offset:-3px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#123B6D;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

<script>
const $=s=>document.querySelector(s);
const D=JSON.parse($('#data').textContent);
let cart={},cat='Tous',q='',so='r',stock=false,pmin='',pmax='',admin=false,edit=false,f={n:'',t:'',a:''},fav=new Set();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('fr-FR')+' '+D.shop.cur;
const items=()=>D.products.filter(p=>cart[p.id]);
const total=()=>items().reduce((t,p)=>t+p.p*cart[p.id],0);
const cats=()=>[...new Set(D.products.map(p=>p.c))];
const icon=c=>c==='Tous'?'🏪':(D.products.find(p=>p.c===c)||{}).e||'📦';
$('#app').innerHTML=`<header><div class=top><b id=nm class=logo></b>
<div class=sb><input id=q type=search placeholder="Rechercher : ciment, marteau, peinture…"><button id=go>Rechercher</button></div>
<div class=hb><button id=sh class=ghost>↗ Partager</button><button id=ab class=ghost hidden>⚙ Gérer</button><button id=cb></button></div></div>
<nav class=tabs><button data-t=all class=on>Tous les produits</button><button data-t=stock>En stock</button><button data-t=ct>Contact</button></nav><div id=shp hidden></div></header>
<main><div class=lay><aside><details id=flt open><summary>Filtres</summary><h4>Catégorie</h4><div id=cl></div>
<h4>Prix</h4><div class=pr2><input id=pmin type=number min=0 placeholder="min"><span>–</span><input id=pmax type=number min=0 placeholder="max"><button id=pok>OK</button></div></details></aside>
<div><div id=cs class=cs></div><div class=meta><span id=cnt></span><label>Trier par <select id=so><option value=r>Pertinence</option><option value=a>Prix croissant</option><option value=d>Prix décroissant</option></select></label></div><div id=grid class=grid></div></div></div>
<section id=cart hidden></section><section id=adm hidden></section><section id=ct hidden></section></main>`;
if(matchMedia('(max-width:799px)').matches)$('#flt').open=false;
function head(){const n=D.shop.name.trim(),i=n.indexOf(' ');$('#nm').innerHTML=i<0?`<span class=n1>${esc(n)}</span>`:`<span class=n1>${esc(n.slice(0,i))}</span> <span class=n2>${esc(n.slice(i+1))}</span>`;document.title=n}
function renderNav(){
 const all=['Tous',...cats()];
 $('#cs').innerHTML=all.map(c=>`<button class="cc${c===cat?' on':''}" data-c="${esc(c)}"><span>${D.ci&&D.ci[c]?`<img src="${D.ci[c]}" alt="">`:esc(icon(c))}</span>${esc(c)}</button>`).join('');
 $('#cl').innerHTML=all.map(c=>`<button class="lk${c===cat?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
}
function renderGrid(){
 let l=D.products.filter(p=>(cat==='Tous'||p.c===cat)&&(!stock||p.s)&&(!q||(p.n+' '+p.c).toLowerCase().includes(q))&&(pmin===''||p.p>=pmin)&&(pmax===''||p.p<=pmax));
 if(so==='a')l=[...l].sort((a,b)=>a.p-b.p);else if(so==='d')l=[...l].sort((a,b)=>b.p-a.p);
 $('#cnt').textContent=l.length+' produit'+(l.length>1?'s':'');
 $('#grid').innerHTML=l.length?l.map(p=>{const i=D.products.indexOf(p),h=fav.has(p.id);
  return `<article class=card><div class=ph>${p.i?`<img src="${p.i}" alt="${esc(p.n)}" loading=lazy>`:esc(p.e)}<button class=hrt data-h="${p.id}" aria-label="Favori">${h?'♥':'♡'}</button></div><div class=bd>
  ${admin&&edit?`<div class=pe><input type=number min=0 data-p="${i}" data-k="p" value="${p.p}">${esc(D.shop.cur)}</div>`:`<p class=pr>${fmt(p.p)}</p>`}
  <h3>${esc(p.n)}</h3>${p.s?'<span class=tag>En stock</span>':'<span class=out>Rupture de stock</span>'}
  ${p.s?`<button class=add data-a="${p.id}">Ajouter au panier</button>`:''}</div></article>`}).join(''):'<p class=mut>Aucun produit trouvé.</p>';
}
const PM={liv:'À la livraison',nita:'NITA',amana:'AMANA'};
const APP={nita:{n:'MyNITA',id:'com.iisoft.tm.myNita'},amana:{n:'AmanaTa',id:'com.iisoft.tm.appamana'}};
function payBlock(){const s=D.shop,pm=f.pm||'liv',o=[['liv','Paiement à la livraison (espèces)']];
 if(s.nita||s.qrn)o.push(['nita','NITA']);if(s.amana)o.push(['amana',"AMANA (transfert d'argent)"]);
 if(o.length<2)return '';
 let h='<label>Mode de paiement</label>'+o.map(([k,l])=>`<label class=rd><input type=radio name=pm data-pm="${k}" ${pm===k?'checked':''}> ${l}</label>`).join('');
 if(pm!=='liv'){const n=pm==='nita'?s.nita:s.amana,nm=PM[pm];
  const ap=APP[pm],pl='https://play.google.com/store/apps/details?id='+ap.id,it='intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package='+ap.id+';S.browser_fallback_url='+encodeURIComponent(pl)+';end';
  h+=`<div class=pay><p><b>Payer ${fmt(total())} avec ${ap.n}</b></p>
  ${n?`<p>1. Copiez le numéro de la boutique : <b>${esc(n)}</b>${s.bn?` (${esc(s.bn)})`:''}</p>
  <button class=ghost data-cpn="${esc(n)}">Copier le numéro</button>`:''}
  ${pm==='nita'&&s.qrn?`<p>${n?'Ou scannez':'Scannez'} ce QR code de la boutique avec la fonction de scan de MyNITA :</p><img class=qr src="${s.qrn}" alt="QR code MyNITA de la boutique">`:''}
  <p>2. Ouvrez ${ap.n} et envoyez le montant exact à ce numéro.</p>
  <a class=send href="${esc(it)}">Ouvrir ${ap.n}</a>
  <p><a href="${esc(pl)}" target="_blank" rel="noopener">Vous n'avez pas l'application ? Téléchargez-la</a></p>
  <p>3. Revenez ici et saisissez la référence du transfert.</p>
  <label>Référence du transfert<input data-f="r" value="${esc(f.r||'')}"></label></div>`}
 return h}
const msg=()=>`Bonjour ${D.shop.name}, je souhaite commander :\n`+items().map(p=>`• ${cart[p.id]} × ${p.n} = ${fmt(p.p*cart[p.id])}`).join('\n')+`\nTotal : ${fmt(total())}\n\nNom : ${f.n}\nTéléphone : ${f.t}\nAdresse de livraison : ${f.a}\nPaiement : ${PM[f.pm||'liv']}${(f.pm||'liv')!=='liv'?' (référence du transfert : '+(f.r||'')+')':''}`;
function upd(){const a=$('#wa');if(!a)return;const w=(D.shop.wa||'').replace(/\D/g,'');a.href=w?`https://wa.me/${w}?text=${encodeURIComponent(msg())}`:'#';a.classList.toggle('dis',!w);$('#nw').hidden=!!w}
function renderCart(){
 const it=items(),n=it.reduce((s,p)=>s+cart[p.id],0);
 $('#cb').textContent=n?`🛒 Panier (${n}) · ${fmt(total())}`:'🛒 Panier vide';
 const s=$('#cart');s.hidden=!n;if(!n)return;
 s.innerHTML=`<h2>Votre commande</h2>`+it.map(p=>`<div class=row><span>${esc(p.n)}</span><span class=qty><button data-m="${p.id}">−</button><b>${cart[p.id]}</b><button data-a="${p.id}">+</button></span><span>${fmt(p.p*cart[p.id])}</span></div>`).join('')+
 `<div class="row tot"><span>Total</span><span>${fmt(total())}</span></div>
 <label>Votre nom<input data-f="n" autocomplete="name" value="${esc(f.n)}"></label>
 <label>Téléphone<input data-f="t" type="tel" autocomplete="tel" value="${esc(f.t)}"></label>
 <label>Adresse de livraison<textarea data-f="a" rows="2">${esc(f.a)}</textarea></label>${payBlock()}
 <a id=wa class=send target=_blank rel=noopener>Envoyer la commande sur WhatsApp</a><button id=cp class=ghost>Copier la commande</button>
 <p class=mut id=nw hidden>Le numéro WhatsApp de la boutique n'est pas encore configuré.</p>
 <p class=mut>Les frais de livraison sont confirmés par la boutique.</p>`;
 upd();
}
function renderContact(){const s=D.shop,t=(s.tel||'').split(/[\/,;]/).map(x=>x.trim()).filter(Boolean),L=[];
 if(s.addr)L.push(`<p>📍 ${esc(s.addr)}</p>`);
 if(t.length)L.push(`<p>📞 ${t.map(x=>`<a href="tel:${x.replace(/[^\d+]/g,'')}">${esc(x)}</a>`).join(' / ')}</p>`);
 if(s.mail)L.push(`<p>✉️ <a href="mailto:${esc(s.mail)}">${esc(s.mail)}</a></p>`);
 const e=$('#ct');e.hidden=!L.length;e.innerHTML=L.length?'<h2>Nous contacter</h2>'+L.join(''):''}
function renderAdmin(){
 const s=$('#adm');s.hidden=!edit;if(!edit)return;
 s.innerHTML=`<h2>Gérer la boutique</h2><p class=mut>Astuce : vous pouvez aussi modifier les prix directement sur les cartes produits.</p>
 <label>Nom de la boutique<input data-s="name" value="${esc(D.shop.name)}"></label>
 <label>Numéro WhatsApp qui reçoit les commandes (avec l'indicatif du pays, chiffres seulement)<input data-s="wa" inputmode="numeric" value="${esc(D.shop.wa)}"></label>
 <label>Devise<input data-s="cur" value="${esc(D.shop.cur)}"></label>
 <label>Numéro NITA pour recevoir les paiements<input data-s="nita" inputmode="numeric" value="${esc(D.shop.nita||'')}"></label>
 <label>Numéro AMANA (transfert d'argent) pour recevoir les paiements<input data-s="amana" inputmode="numeric" value="${esc(D.shop.amana||'')}"></label>
 <label>Nom du bénéficiaire affiché aux clients<input data-s="bn" value="${esc(D.shop.bn||'')}"></label>
 <label>Téléphones (séparés par « / »)<input data-s="tel" value="${esc(D.shop.tel||'')}"></label>
 <label>E-mail<input data-s="mail" type="email" value="${esc(D.shop.mail||'')}"></label>
 <label>Adresse<input data-s="addr" value="${esc(D.shop.addr||'')}"></label>
 <h2 style="margin-top:18px">Produits (touchez 📷 pour ajouter une photo)</h2>`+
 D.products.map((p,i)=>`<div class=prow><label class=pic>${p.i?`<img src="${p.i}" alt="">`:'📷'}<input type=file accept="image/*" data-img="${i}" hidden></label><input data-p="${i}" data-k="e" value="${esc(p.e)}"><input data-p="${i}" data-k="n" value="${esc(p.n)}"><input data-p="${i}" data-k="c" value="${esc(p.c)}"><input data-p="${i}" data-k="p" type="number" min="0" value="${p.p}"><label class=chk><input type="checkbox" data-p="${i}" data-k="s" ${p.s?'checked':''}>En stock</label><button data-del="${i}">Supprimer</button></div>`).join('')+
 `<p><button id=addp class=ghost>+ Ajouter un produit</button></p><button id=pub class=send>Publier les changements</button><p class=mut>Les clients voient vos changements après la publication.</p>`;
}
function photo(i,file){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);D.products[i].i=c.toDataURL('image/jpeg',.78);renderAdmin();renderGrid();renderCart()};im.onerror=()=>alert('Image illisible.');im.src=r.result};r.readAsDataURL(file)}
async function publish(){
 try{const a=window.claude&&await claude.use('artifact');if(!a){alert('Publication indisponible ici.');return}
 const c=document.documentElement.cloneNode(true);c.removeAttribute("style");c.removeAttribute("data-theme");
 c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
 c.querySelector('#app').innerHTML='';
 await a.publish('<!doctype html>\n'+c.outerHTML);
 }catch(e){alert('La publication a échoué : '+((e&&e.message)||e))}
}
const LINK=location.href.split('#')[0].split('?')[0];
function share(){const p=$('#shp');
 if(p.hidden){const t=encodeURIComponent('Commandez en ligne chez '+D.shop.name+' : '+LINK);
  p.innerHTML=`<a class=send style="background:#128c4a" target=_blank rel=noopener href="https://wa.me/?text=${t}">WhatsApp</a><a class=send style="background:#1877f2" target=_blank rel=noopener href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(LINK)}">Facebook</a><button class=send style="background:#111" data-cp="tt">TikTok</button><button class=ghost data-cp="cp">Copier le lien</button>`}
 p.hidden=!p.hidden}
async function copyLink(k){try{await navigator.clipboard.writeText(LINK);alert(k==='tt'?'Lien copié. Collez-le dans la bio de votre compte TikTok, la description ou un commentaire de votre vidéo.':'Lien de la boutique copié.')}catch(_){prompt('Copiez le lien de la boutique :',LINK)}}
async function copyNum(v,b){const d=String(v).replace(/\D/g,'');try{await navigator.clipboard.writeText(d);b.textContent='Numéro copié ✓'}catch(_){prompt('Copiez le numéro :',d)}}
const all=()=>{renderNav();renderGrid();renderCart()};
document.addEventListener('click',async e=>{
 const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;
 if(d.c!==undefined){cat=d.c;renderNav();renderGrid()}
 else if(d.t){if(d.t==='ct'){const c=$('#ct');if(!c.hidden)c.scrollIntoView({behavior:'smooth'})}else{stock=d.t==='stock';document.querySelectorAll('.tabs [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===d.t));renderGrid()}}
 else if(d.h){fav.has(d.h)?fav.delete(d.h):fav.add(d.h);renderGrid()}
 else if(d.a){cart[d.a]=(cart[d.a]||0)+1;renderCart()}
 else if(d.m){if(--cart[d.m]<=0)delete cart[d.m];renderCart()}
 else if(d.cp){copyLink(d.cp)}
 else if(d.cpn){copyNum(d.cpn,t)}
 else if(t.id==='sh'){share()}
 else if(t.id==='go'){q=$('#q').value.toLowerCase().trim();renderGrid()}
 else if(t.id==='pok'){pmin=$('#pmin').value===''?'':+$('#pmin').value;pmax=$('#pmax').value===''?'':+$('#pmax').value;renderGrid()}
 else if(t.id==='cb'){const c=$('#cart');if(!c.hidden)c.scrollIntoView({behavior:'smooth'})}
 else if(t.id==='ab'){edit=!edit;renderAdmin();renderGrid();if(edit)$('#adm').scrollIntoView({behavior:'smooth'})}
 else if(t.id==='wa'){if(!f.n.trim()||!f.a.trim()){e.preventDefault();alert('Indiquez votre nom et votre adresse de livraison.')}else if((f.pm||'liv')!=='liv'&&!(f.r||'').trim()){e.preventDefault();alert('Indiquez la référence de votre transfert.')}}
 else if(t.id==='cp'){try{await navigator.clipboard.writeText(msg());t.textContent='Commande copiée ✓'}catch(_){prompt('Copiez votre commande :',msg())}}
 else if(t.id==='addp'){D.products.push({id:'p'+Date.now(),n:'Nouveau produit',p:0,c:'Divers',e:'📦',s:true});renderAdmin();all()}
 else if(d.del!==undefined){if(confirm('Supprimer ce produit ?')){const p=D.products.splice(+d.del,1)[0];delete cart[p.id];renderAdmin();all()}}
 else if(t.id==='pub'){publish()}
});
document.addEventListener('input',e=>{
 const t=e.target,d=t.dataset;
 if(t.id==='q'){q=t.value.toLowerCase().trim();renderGrid()}
 else if(t.id==='so'){so=t.value;renderGrid()}
 else if(d.f){f[d.f]=t.value;upd()}
 else if(d.pm){f.pm=d.pm;renderCart()}
 else if(d.s){D.shop[d.s]=t.value;head();renderGrid();renderCart();renderContact()}
 else if(d.img!==undefined){photo(+d.img,t.files[0])}
 else if(d.p!==undefined){const p=D.products[+d.p];p[d.k]=d.k==='s'?t.checked:d.k==='p'?Number(t.value)||0:t.value;
  if(t.closest('#grid')){renderCart()}else{renderNav();renderGrid();renderCart()}}
});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')renderGrid()});
head();all();renderContact();
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1500)}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('button,a,.card,.cc,.lk,label.rd');if(t){t.classList.add('tap');setTimeout(()=>t.classList.remove('tap'),250)}},true);
document.addEventListener('click',e=>{const t=e.target.closest('button,a,.card');if(!t)return;
 try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}
 const d=t.dataset;let m='';
 if(d.a){const p=D.products.find(x=>x.id===d.a);m='✓ Ajouté au panier'+(p?' : '+p.n:'')}
 else if(d.m)m='Quantité réduite';
 else if(d.h)m=fav.has(d.h)?'♥ Ajouté aux favoris':'Retiré des favoris';
 else if(d.c!==undefined)m='Catégorie : '+d.c;
 else if(d.t&&d.t!=='ct')m=t.textContent.trim();
 else if(t.id==='go')m='Recherche lancée';
 else if(t.id==='pok')m='Filtre de prix appliqué';
 else if(d.cpn)m='✓ Numéro copié';
 else if(d.cp)m='✓ Lien copié';
 else if(t.id==='sh')m='Partager la boutique';
 else if(t.classList.contains('card')){const n=t.querySelector('h3');m='Sélectionné : '+(n?n.textContent:'produit');document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'));t.classList.add('sel');setTimeout(()=>t.classList.remove('sel'),900)}
 if(m)toast(m)});
(async()=>{try{const u=window.claude&&await claude.use('user');if(u&&u.canEdit&&u.canEdit()){admin=true;$('#ab').hidden=false}}catch(_){}})();
</script>
</body></html>
